# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables:
#   GOOGLE_SITE_VERIFICATION  the content value of Search Console's HTML meta tag
#   GOATCOUNTER_CODE          GoatCounter site code (free only for non-commercial sites)
#   CF_ANALYTICS_TOKEN        Cloudflare Web Analytics site token
#   ADSENSE_CLIENT            AdSense publisher ID, ca-pub-… (adds the AdSense script and ads.txt)
#   ADSENSE_SLOT_CALCULATOR   AdSense ad unit ID shown below the calculator
#   ADSENSE_SLOT_FILING       AdSense ad unit ID shown below the filing guide
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # /<repo-name>/ on github.io, / on a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Full public URL (follows a custom domain if one is set up).
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_CALCULATOR: ${{ vars.ADSENSE_SLOT_CALCULATOR }}
          VITE_ADSENSE_SLOT_FILING: ${{ vars.ADSENSE_SLOT_FILING }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
